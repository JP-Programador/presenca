[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA: qualquer rota que não seja um arquivo estático cai no index.html
# e o React Router assume o roteamento client-side (senão /lider, /coordenador
# etc. dão 404 direto no servidor ao dar F5 ou abrir o link).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self)"

# JS/CSS com hash no nome (Vite) podem ser cacheados por muito tempo
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
